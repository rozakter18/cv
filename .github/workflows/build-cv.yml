name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:        

permissions:
  contents: write           

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex          
          # latexmk_use_xelatex: true  

      - name: Rename PDF
        run: mv main.pdf Roza_Akter_CV.pdf  

      - name: Publish latest CV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-latest
          name: Latest CV
          body: Automatically built from the latest LaTeX source.
          files: Roza_Akter_CV.pdf
          make_latest: true
